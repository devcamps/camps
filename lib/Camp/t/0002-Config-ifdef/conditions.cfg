Variable TRUE 1
Variable FALSE 0
Variable FOO pooh

Variable IFDEF_TRUE off
ifdef TRUE
Variable IFDEF_TRUE on
endif

Variable IFDEF_FALSE off
ifdef FALSE
Variable IFDEF_FALSE on
endif

Variable IFDEF_UNSET off
ifdef UNSET
Variable IFDEF_UNSET on
endif

Variable IFNDEF_TRUE off
ifndef TRUE
Variable IFNDEF_TRUE on
endif

Variable IFNDEF_FALSE off
ifndef FALSE
Variable IFNDEF_FALSE on
endif

Variable IFNDEF_UNSET off
ifndef UNSET
Variable IFNDEF_UNSET on
endif

Variable INDENTED off
    ifdef TRUE
        Variable INDENTED on
    endif  

Variable INDENTED_SKIP off
	ifdef FALSE
	Variable INDENTED_SKIP on
	endif
Variable INDENTED_AFTER on

Variable MIXED_CASE off
IFDEF TRUE
Variable MIXED_CASE on
EndIf

Variable EXPR_TRUE off
ifdef FOO eq 'pooh'
Variable EXPR_TRUE on
endif

Variable EXPR_FALSE off
ifdef FOO eq 'bear'
Variable EXPR_FALSE on
endif

# GFLAG is only set globally, TRUE only in the catalog.
Variable GLOBAL_VAR off
ifdef @GFLAG
Variable GLOBAL_VAR on
endif

Variable GLOBAL_VAR_CATALOG_ONLY off
ifdef @TRUE
Variable GLOBAL_VAR_CATALOG_ONLY on
endif

Variable CATALOG_VAR_GLOBAL_ONLY off
ifdef GFLAG
Variable CATALOG_VAR_GLOBAL_ONLY on
endif

# Not a conditional; if it were, the following line would be skipped.
ifdefault yes
Variable IFDEFAULT on

# Conditional directives inside a here-doc are part of its value.
Variable HEREDOC <<EOV
ifdef FALSE
#ifdef FALSE
endif
#endif
EOV

# A here-doc in a true block is read whole, closer and all.
ifdef TRUE
Variable HEREDOC_TRUE <<EOH
endif
Variable HEREDOC_LEAK on
EOH
endif

# Lines beginning with an octothorpe are comments, so the old #ifdef form
# guards nothing and a commented-out conditional has no effect.
Variable OLD_FORM off
#ifdef FALSE
Variable OLD_FORM on
#endif

Variable COMMENTED_OPENER off
ifdef TRUE
#ifdef FALSE
Variable COMMENTED_OPENER on
#endif
endif

Variable COMMENTED_CLOSER off
ifdef FALSE
#endif
Variable COMMENTED_CLOSER on
endif
